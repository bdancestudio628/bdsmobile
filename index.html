<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>B Dance Studio</title>
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
:root{--acc:#ff7a29;--acc2:#ffa057;--bd:#3a2010;--bd2:rgba(58,32,16,.45);--card:#171412;--card2:#0c0c0c;--ink:#1a1006;--g5:#8a857d;--g4:#b9b5ad;--g2:#e8e4dc;--ember:#ff4d2e}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0a0a0a;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
a{color:var(--acc);text-decoration:none}
a:hover{color:var(--acc2)}
i.ph{display:inline-block;vertical-align:-.11em;font-style:normal}
.dsp{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:-.5px}
.mn{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.bd-scroll{-ms-overflow-style:none;scrollbar-width:none}
.bd-scroll::-webkit-scrollbar{display:none}
button{font-family:inherit}
input{font-family:inherit}
@keyframes rake{0%{transform:translateX(-14%) skewX(-12deg)}50%{transform:translateX(10%) skewX(-12deg)}100%{transform:translateX(-14%) skewX(-12deg)}}
@keyframes ctick{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes glowpulse{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes bounce3{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}
@keyframes sheenmove{0%{transform:translateX(-120%)}100%{transform:translateX(220%)}}
@keyframes ringpop{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.1);opacity:0}}
@keyframes barpulse{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@keyframes blob{0%{transform:translate(0,0) scale(1)}33%{transform:translate(8%,-6%) scale(1.18)}66%{transform:translate(-7%,7%) scale(.92)}100%{transform:translate(0,0) scale(1)}}
@keyframes tape{from{background-position:0 0}to{background-position:64px 0}}
@keyframes gridpan{from{transform:translateY(0)}to{transform:translateY(-46px)}}
@keyframes crawl{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes flick{0%,94%,100%{opacity:.22}96%{opacity:.06}98%{opacity:.3}}
.ct{opacity:0;animation:ctick .2s ease-out forwards}
.sheen{position:relative;overflow:hidden}
.sheen::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.28) 50%,transparent 80%);animation:sheenmove 2.6s ease-in-out infinite}
.page{position:absolute;inset:0;display:none}
.page.active{display:block}
.btn-fill{cursor:pointer;transition:transform .15s}
.btn-fill:active{transform:scale(.96)}
.row-hit{position:relative;overflow:hidden;cursor:pointer;transition:border-color .2s}
.row-hit:active{border-color:var(--acc)}
#toast{position:fixed;left:16px;right:16px;bottom:24px;z-index:9999;background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--acc);padding:12px 16px;font-size:12.5px;color:#fff;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateY(0)}
.field-label{display:block;color:var(--g5);font-size:9px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
.field-input{width:100%;background:#000;border:1px solid #3d3a36;color:#fff;font-size:13px;padding:12px;outline:none;font-family:'JetBrains Mono',monospace}
.field-input:focus{border-color:var(--acc)}
.role-btn{position:relative;overflow:hidden;padding:16px 10px;cursor:pointer;text-align:left;transition:all .2s;border-radius:2px}
</style>
</head>
<body>
<div id="toast"></div>

<div id="loading-screen" class="page active" style="background:#000;z-index:300;display:flex;align-items:center;justify-content:center">
  <div style="text-align:center">
    <img src="assets/logo.png" alt="" style="width:64px;height:64px;object-fit:contain;margin:0 auto 16px;display:block;animation:glowpulse 1.1s ease-in-out infinite"/>
    <div style="display:flex;justify-content:center;gap:6px">
      <span style="width:7px;height:7px;border-radius:50%;background:var(--acc);animation:bounce3 1.1s infinite"></span>
      <span style="width:7px;height:7px;border-radius:50%;background:var(--acc);animation:bounce3 1.1s .15s infinite"></span>
      <span style="width:7px;height:7px;border-radius:50%;background:var(--acc);animation:bounce3 1.1s .3s infinite"></span>
    </div>
  </div>
</div>

<div id="intro-screen" class="page">
  <div aria-hidden="true" style="position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;background:radial-gradient(120% 80% at 80% 0%,#100d0b,#0a0a0a 55%)">
    <div style="position:absolute;top:-10%;left:-25%;width:70%;height:45%;border-radius:50%;filter:blur(46px);background:radial-gradient(circle,rgba(255,122,41,.15),transparent 66%);animation:blob 17s ease-in-out infinite"></div>
    <div style="position:absolute;bottom:6%;right:-22%;width:66%;height:40%;border-radius:50%;filter:blur(52px);background:radial-gradient(circle,rgba(255,77,46,.11),transparent 70%);animation:blob 23s ease-in-out -6s infinite"></div>
    <div style="position:absolute;inset:-46px 0;opacity:.45;background-image:linear-gradient(rgba(255,122,41,.035) 1px,transparent 1px);background-size:100% 46px;animation:gridpan 5.5s linear infinite"></div>
    <div style="position:absolute;top:34%;left:-8%;right:-8%;height:26px;transform:rotate(-7deg);opacity:.055;background-image:repeating-linear-gradient(115deg,var(--acc) 0 22px,transparent 22px 44px);animation:tape 1.9s linear infinite"></div>
    <div style="position:absolute;top:12%;left:0;right:0;overflow:hidden;opacity:.03">
      <div class="dsp" style="display:flex;gap:26px;width:max-content;font-size:92px;line-height:.8;color:transparent;-webkit-text-stroke:1.5px var(--acc);white-space:nowrap;animation:crawl 26s linear infinite">
        <span>BRAVE &middot; DREAM &middot; SHINE &middot;</span><span>BRAVE &middot; DREAM &middot; SHINE &middot;</span><span>BRAVE &middot; DREAM &middot; SHINE &middot;</span>
      </div>
    </div>
    <div style="position:absolute;inset:0;opacity:.16;background-image:repeating-linear-gradient(180deg,rgba(0,0,0,.5) 0 1px,transparent 1px 3px);animation:flick 7s steps(1,end) infinite"></div>
  </div>

  <div class="bd-scroll" style="position:absolute;inset:0;overflow-y:auto;padding-top:52px;z-index:1">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 18px 0;gap:8px">
      <button onclick="goAuth()" class="mn btn-fill" style="display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border:0;border-radius:999px;cursor:pointer;background:linear-gradient(100deg,#ff8b3d,var(--acc) 55%,#e8611a);color:var(--ink);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 8px 20px -8px rgba(255,122,41,.85)"><i class="ph ph-sign-in" style="font-size:15px"></i><span id="m-signin-label">Sign In</span></button>
      <div style="display:flex;border-radius:999px;overflow:hidden;border:1px solid var(--bd);background:var(--card);font-size:10.5px;font-weight:700">
        <button onclick="setLang('en')" id="m-lang-en" style="padding:7px 13px;border:0;cursor:pointer">EN</button>
        <button onclick="setLang('zh')" id="m-lang-zh" style="padding:7px 13px;border:0;cursor:pointer">中文</button>
      </div>
    </div>

    <div style="position:relative;overflow:hidden;padding:22px 18px 26px">
      <div aria-hidden="true" style="pointer-events:none;position:absolute;top:-25%;right:-60px;height:150%;width:70%;background:linear-gradient(to bottom left,rgba(255,122,41,.17),rgba(255,77,46,.07),transparent);animation:rake 9s ease-in-out infinite"></div>
      <div style="position:relative">
        <img src="assets/logo.png" alt="B Dance Studio" style="width:46px;height:46px;object-fit:contain;margin-bottom:16px"/>
        <p class="mn" id="m-hero-eyebrow" style="color:var(--acc);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.2em;margin:0 0 10px"></p>
        <h1 class="dsp" id="m-hero-title" style="font-size:48px;line-height:.9;text-transform:uppercase;margin:0 0 14px"></h1>
        <p id="m-hero-lead" style="color:var(--g4);font-size:13px;line-height:1.65;margin:0 0 18px"></p>
        <div style="display:flex;gap:8px;margin-bottom:22px">
          <button onclick="scrollToSection('m-locations')" class="mn btn-fill" style="display:inline-flex;align-items:center;gap:7px;padding:11px 15px;border:0;border-radius:999px;cursor:pointer;background:linear-gradient(100deg,#ff8b3d,var(--acc) 55%,#e8611a);color:var(--ink);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap"><i class="ph ph-map-pin" style="font-size:15px"></i><span id="m-find-btn"></span></button>
          <button onclick="scrollToSection('m-instructors')" class="mn btn-fill" style="display:inline-flex;align-items:center;gap:7px;padding:11px 15px;border-radius:999px;border:1px solid rgba(255,160,87,.4);background:rgba(255,122,41,.07);color:var(--acc2);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;cursor:pointer"><i class="ph ph-users-three" style="font-size:15px"></i><span id="m-meet-btn"></span></button>
        </div>
        <div id="m-stats" style="display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)"></div>
      </div>
    </div>

    <div style="padding:26px 18px;border-top:1px solid var(--bd2)">
      <p class="mn" style="color:var(--acc);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;margin:0 0 12px" id="m-events-title"></p>
      <div id="m-events-wrap" style="overflow:hidden;border:1px solid var(--bd);background:var(--card)">
        <div id="m-events-track" style="display:flex"></div>
      </div>
      <div id="m-event-dots" style="display:flex;justify-content:center;gap:7px;margin-top:14px"></div>
    </div>

    <div id="m-shops-section" style="padding:26px 0;border-top:1px solid var(--bd2);display:none">
      <div style="padding:0 18px">
        <p class="mn" style="color:var(--acc);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;margin:0 0 8px" id="m-shops-eyebrow"></p>
        <h2 class="dsp" style="font-size:30px;text-transform:uppercase;margin:0 0 8px" id="m-shops-title"></h2>
        <p style="color:var(--g4);font-size:12.5px;line-height:1.6;margin:0 0 16px" id="m-shops-lead"></p>
      </div>
      <div style="overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)">
        <div id="m-shops-row" style="display:flex;gap:14px;width:max-content;animation:drift 26s linear infinite;padding:0 18px"></div>
      </div>
    </div>

    <div style="padding:26px 18px;border-top:1px solid var(--bd2)">
      <p class="mn" style="color:var(--acc);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;margin:0 0 8px" id="m-about-eyebrow"></p>
      <h2 class="dsp" style="font-size:30px;text-transform:uppercase;line-height:.95;margin:0 0 10px" id="m-about-title"></h2>
      <p style="color:var(--g4);font-size:12.5px;line-height:1.7;margin:0" id="m-about-lead"></p>
    </div>

    <div id="m-instructors" style="padding:26px 18px;border-top:1px solid var(--bd2)">
      <p class="mn" style="color:var(--acc);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;margin:0 0 8px" id="m-instr-eyebrow"></p>
      <h2 class="dsp" style="font-size:30px;text-transform:uppercase;line-height:.95;margin:0 0 10px" id="m-instr-title"></h2>
      <p style="color:var(--g4);font-size:12.5px;line-height:1.6;margin:0 0 16px" id="m-instr-lead"></p>
      <div id="m-teacher-list" style="display:flex;flex-direction:column;gap:10px"></div>
      <button onclick="toggleAllTeachers()" id="m-teacher-toggle" class="mn btn-fill" style="width:100%;margin-top:14px;background:transparent;border:1px solid #a84715;color:var(--acc2);font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:12px;cursor:pointer;display:none"></button>
    </div>

    <div id="m-locations" style="padding:26px 18px;border-top:1px solid var(--bd2)">
      <p class="mn" style="color:var(--acc);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.2em;margin:0 0 8px" id="m-loc-eyebrow"></p>
      <h2 class="dsp" style="font-size:30px;text-transform:uppercase;line-height:.95;margin:0 0 10px" id="m-loc-title"></h2>
      <p style="color:var(--g4);font-size:12.5px;line-height:1.6;margin:0 0 16px" id="m-loc-lead"></p>
      <div id="m-locations-list" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>

    <div style="padding:34px 18px;border-top:1px solid var(--bd2);text-align:center">
      <h2 class="dsp" style="font-size:34px;text-transform:uppercase;margin:0 0 8px" id="m-cta-title"></h2>
      <p style="color:var(--g4);font-size:12.5px;margin:0 0 18px" id="m-cta-lead"></p>
      <button onclick="openContact()" class="mn sheen btn-fill" style="width:100%;background:var(--acc);color:#000;font-weight:700;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;padding:14px;border:0;cursor:pointer;box-shadow:4px 4px 0 var(--ember)" id="m-cta-btn"></button>
    </div>

    <div id="m-footer" style="padding:26px 18px 40px;border-top:1px solid var(--bd2);background:rgba(5,5,5,.82)">
      <h5 class="dsp" style="color:#fff;font-size:22px;text-transform:uppercase;margin:0 0 8px">B Dance Studio</h5>
      <p style="color:var(--g5);font-size:11px;line-height:1.7;margin:0 0 14px" id="m-foot-tag"></p>
      <div id="m-foot-social" class="mn" style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px"></div>
      <div id="m-foot-contact" style="display:flex;flex-direction:column;gap:6px;font-size:11.5px;color:var(--g4)"></div>
      <p class="mn" id="m-foot-copy" style="color:#4a4640;font-size:9px;text-align:center;margin:26px 0 0"></p>
    </div>
  </div>
</div>

<div id="auth-screen" class="page">
  <div class="bd-scroll" style="position:absolute;inset:0;overflow-y:auto;padding:60px 22px 40px">
    <div aria-hidden="true" style="pointer-events:none;position:absolute;top:0;right:-80px;height:70%;width:80%;background:linear-gradient(to bottom left,rgba(255,122,41,.14),transparent 65%);animation:rake 11s ease-in-out infinite"></div>
    <div style="position:relative">
      <button onclick="goIntro()" class="mn btn-fill" style="background:none;border:0;color:var(--g5);font-size:10px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:0;margin-bottom:26px" id="m-auth-back"></button>
      <div style="text-align:center;margin-bottom:26px">
        <img src="assets/logo.png" alt="B Dance Studio" style="width:78px;height:78px;object-fit:contain;margin:0 auto 14px;display:block"/>
        <h1 class="dsp" style="font-size:38px;text-transform:uppercase;margin:0">B Dance Studio</h1>
        <p class="mn" style="color:var(--g5);font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;margin:6px 0 0" id="m-auth-portal"></p>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px">
        <button onclick="pickRole('student')" id="m-role-student" class="role-btn">
          <div style="font-size:22px;line-height:1;margin-bottom:8px"><i class="ph ph-graduation-cap"></i></div>
          <p class="mn" style="margin:0;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase" id="m-role-student-label"></p>
          <p style="margin:4px 0 0;font-size:10px;color:var(--g5);line-height:1.4" id="m-role-student-sub"></p>
        </button>
        <button onclick="pickRole('teacher')" id="m-role-teacher" class="role-btn">
          <div style="font-size:22px;line-height:1;margin-bottom:8px"><i class="ph ph-person-simple-run"></i></div>
          <p class="mn" style="margin:0;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase" id="m-role-teacher-label"></p>
          <p style="margin:4px 0 0;font-size:10px;color:var(--g5);line-height:1.4" id="m-role-teacher-sub"></p>
        </button>
      </div>

      <div style="background:var(--card);border:1px solid var(--bd);padding:20px">
        <p class="mn" style="color:var(--acc);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 14px" id="m-cred-heading"></p>
        <div id="m-cred-error" style="display:none;color:var(--ember);font-size:11.5px;margin:0 0 12px"></div>
        <label class="field-label" id="m-username-label"></label>
        <input id="login-user" class="field-input" style="margin-bottom:12px" autocomplete="username"/>
        <label class="field-label" id="m-password-label"></label>
        <div style="position:relative;margin-bottom:18px">
          <input id="login-pass" type="password" class="field-input" style="padding-right:42px" autocomplete="current-password"/>
          <button onclick="togglePw()" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer"><i class="ph ph-eye" id="m-pw-eye" style="color:var(--g5);font-size:16px"></i></button>
        </div>
        <button onclick="doLogin()" id="m-login-btn" class="mn sheen btn-fill" style="width:100%;background:var(--acc);color:#000;font-weight:700;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;padding:14px;border:0;cursor:pointer;box-shadow:4px 4px 0 var(--ember)"></button>
      </div>

      <div style="display:flex;border:1px solid var(--bd);background:var(--card);font-size:11px;font-weight:700;overflow:hidden;width:max-content;margin:22px auto 0">
        <button onclick="setLang('en')" style="padding:7px 14px;border:0;cursor:pointer" id="m-lang2-en">EN</button>
        <button onclick="setLang('zh')" style="padding:7px 14px;border:0;cursor:pointer" id="m-lang2-zh">中文</button>
      </div>
    </div>
  </div>
</div>

<div id="app-screen" class="page" style="background:#0a0a0a">
  <header style="border-bottom:2px solid var(--acc);background:#000;position:absolute;top:0;left:0;right:0;z-index:2">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px">
      <div style="display:flex;align-items:center;gap:9px;min-width:0">
        <img src="assets/logo.png" alt="" style="width:26px;height:26px;object-fit:contain"/>
        <div style="min-width:0">
          <p class="dsp" style="font-size:17px;text-transform:uppercase;margin:0;line-height:1">B Dance Studio</p>
          <p class="mn" id="m-app-role" style="font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;margin:2px 0 0;color:var(--acc)"></p>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="display:flex;border:1px solid var(--bd);background:var(--card);font-size:10px;font-weight:700;overflow:hidden">
          <button onclick="setLang('en')" id="m-lang3-en" style="padding:5px 8px;border:0;cursor:pointer">EN</button>
          <button onclick="setLang('zh')" id="m-lang3-zh" style="padding:5px 8px;border:0;cursor:pointer">中</button>
        </div>
        <button onclick="toggleMenu()" style="background:none;border:1px solid var(--bd);color:var(--acc);width:32px;height:32px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center"><i class="ph ph-list"></i></button>
      </div>
    </div>
  </header>

  <main class="bd-scroll" style="position:absolute;top:50px;bottom:66px;left:0;right:0;overflow-y:auto;padding:16px 14px 22px">
    <div id="pg-fees"></div>
    <div id="pg-myclasses" style="display:none"></div>
    <div id="pg-allclasses" style="display:none"></div>
    <div id="pg-attendance" style="display:none"></div>
    <div id="pg-rewards" style="display:none"></div>
    <div id="pg-profile" style="display:none"></div>
    <div id="pg-today" style="display:none"></div>
    <div id="pg-roster" style="display:none"></div>
    <div id="pg-hours" style="display:none"></div>
    <div id="pg-mark" style="display:none"></div>
    <div id="pg-tprofile" style="display:none"></div>
    <div id="pg-staff" style="display:none"></div>
  </main>

  <nav id="m-bottomnav" style="position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--acc);display:flex;padding-bottom:14px"></nav>
</div>

<div id="menu-drawer" style="position:absolute;inset:0;background:rgba(0,0,0,.8);z-index:190;padding-top:100px;display:none" onclick="toggleMenu()">
  <div style="background:var(--card);border-top:1px solid var(--bd);border-bottom:2px solid var(--acc);padding:14px" onclick="event.stopPropagation()">
    <button onclick="goProfilePage()" id="m-menu-profile" style="width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd2);padding:13px 8px;cursor:pointer;font-size:12.5px;color:#fff"><i class="ph ph-user-circle" style="margin-right:8px"></i><span id="m-menu-profile-label"></span></button>

async function fetchWithTimeout(url,opts,ms){
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),ms||8000);
  try{ return await fetch(url,{...opts,signal:ctrl.signal}); }
  finally{ clearTimeout(timer); }
}

async function cloudLoadPublic(){
  try{
    const r=await fetchWithTimeout(CLOUD_URL,{method:'GET'},8000);
    if(!r||!r.ok) return false;
    const j=await r.json();
    if(!j||!j.data) return false;
    const parsed=JSON.parse(j.data);
    if(parsed&&parsed.db){ Object.keys(parsed.db).forEach(k=>{ DB[k]=parsed.db[k]; }); ensureIntro(); return true; }
    return false;
  }catch(e){ return false; }
}
let nid={};
async function cloudLoadFull(){
  try{
    const r=await fetchWithTimeout(CLOUD_URL,{method:'GET',headers:sessionToken?{'Authorization':'Bearer '+sessionToken}:{}},8000);
    if(!r||!r.ok) return false;
    const j=await r.json();
    if(!j||!j.data) return false;
    const parsed=JSON.parse(j.data);
    if(parsed&&parsed.db&&parsed.scope!=='public'){
      Object.keys(parsed.db).forEach(k=>{ DB[k]=parsed.db[k]; }); ensureIntro(); dbIsPublicOnly=false;
      if(parsed.nid&&typeof parsed.nid==='object') nid=parsed.nid;
      return true;
    }
    return false;
  }catch(e){ return false; }
}
async function serverLogin(u,p,role){
  try{
    const r=await fetchWithTimeout(CLOUD_URL,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'login',user:u,pass:p,role})},8000);
    if(!r||!r.ok) return null;
    const j=await r.json().catch(()=>null);
    if(!j||typeof j.ok!=='boolean') return null;
    return j;
  }catch(e){ return null; }
}

const fmt=n=>'RM '+Number(n||0).toLocaleString();
const C=id=>DB.classes.find(c=>c.id===id)||{name:'—'};
const S=id=>DB.students.find(s=>s.id===id)||{name:'—'};
const T=id=>DB.teachers.find(t=>t.id===id)||{name:'—'};
const SC=s=>(s.classIds||[]).map(id=>C(id)).filter(c=>c&&c.id);
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAY_ZH={Sunday:'周日',Monday:'周一',Tuesday:'周二',Wednesday:'周三',Thursday:'周四',Friday:'周五',Saturday:'周六'};
function dayLabel(d){ return currentLang==='zh'?(DAY_ZH[d]||d):d; }
function toLocalISODate(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function ageOf(s){
  if(s&&s.birthday){
    const bd=new Date(s.birthday+'T00:00:00');
    if(!isNaN(bd)){ const t=new Date(); let a=t.getFullYear()-bd.getFullYear(); const m=t.getMonth()-bd.getMonth();
      if(m<0||(m===0&&t.getDate()<bd.getDate())) a--; if(a>=0&&a<130) return a; }
  }
  return (s&&s.age!=null&&s.age!=='')?s.age:'—';
}
function creditExpiryOf(s){ return (s&&s.creditExpiry)||''; }
function creditsExpired(s){ const e=creditExpiryOf(s); return !!e&&e<toLocalISODate(new Date()); }
function creditsOf(s){ return creditsExpired(s)?0:((s&&s.credits)||0); }
function attWeight(a){ return (a.extra&&a.dur==='half')?0.5:1; }
function counted(a){
  if(a.status==='cancelled') return false;
  if(a.single) return false;
  if(a.extra) return true;
  if(a.paidByCredit) return false;
  return true;
}
function presentCount(sid){ return DB.attendance.filter(a=>a.studentId===sid&&counted(a)).reduce((n,a)=>n+attWeight(a),0); }
function styleGradesOf(s){ return (s&&s.styleGrades&&typeof s.styleGrades==='object')?s.styleGrades:{}; }
function highestGrade(s){ const vals=Object.values(styleGradesOf(s)).filter(v=>v>0); if(vals.length) return Math.max(...vals); return (s&&s.grade)||1; }
function hasAnyGrade(s){ return Object.values(styleGradesOf(s)).some(v=>v>0)||!!(s&&s.grade>0); }
const GRADE_META={1:{tier:'Bronze',tierZh:'铜级',icon:'ph-medal',c:'#e39b5a'},2:{tier:'Silver',tierZh:'银级',icon:'ph-medal',c:'#eef1f4'},
  3:{tier:'Gold',tierZh:'金级',icon:'ph-medal',c:'#ffdf6e'},4:{tier:'Diamond',tierZh:'钻石级',icon:'ph-diamond',c:'#8fe9ff'},5:{tier:'Crown',tierZh:'皇冠级',icon:'ph-crown',c:'#ffd75e'}};
function gradeMeta(g){ return GRADE_META[g]||GRADE_META[1]; }
function gradeTierLabel(g){ const m=gradeMeta(g); return currentLang==='zh'?m.tierZh:m.tier; }
function ensureRewards(){ if(!Array.isArray(DB.rewards)) DB.rewards=[]; }
function rewardsList(){ ensureRewards(); return DB.rewards; }
function rewardName(r){ if(!r) return ''; if(r.name&&String(r.name).trim()) return currentLang==='zh'&&r.zh?r.zh:r.name; return r.id||''; }
function studentPendingPoints(sid){ const s=DB.students.find(x=>x.id===sid); return ((s&&s.redemptions)||[]).filter(r=>!r.collected).reduce((n,r)=>n+(r.cost||0),0); }
function studentRedeemedPoints(sid){ const s=DB.students.find(x=>x.id===sid); return ((s&&s.redemptions)||[]).filter(r=>r.collected).reduce((n,r)=>n+(r.cost||0),0); }
function studentBonusPoints(sid){ const s=DB.students.find(x=>x.id===sid); return ((s&&s.bdayClaims)?s.bdayClaims.length:0)*100; }
function studentAdjustPoints(sid){ const s=DB.students.find(x=>x.id===sid); return (s&&Number(s.pointsAdjust))||0; }
function gradePoints(g){ return ({0:1,1:2,2:5,3:10,4:10,5:10})[g]||1; }
function studentEarnedPoints(sid){
  const s=DB.students.find(x=>x.id===sid); if(!s) return 0;
  const g=hasAnyGrade(s)?highestGrade(s):0;
  return DB.attendance.filter(a=>a.studentId===sid&&a.status==='present').length*gradePoints(g);
}
function pointsBalance(sid){ return studentEarnedPoints(sid)+studentBonusPoints(sid)+studentAdjustPoints(sid)-studentRedeemedPoints(sid); }
function spendablePoints(sid){ return pointsBalance(sid)-studentPendingPoints(sid); }
function birthdayInfo(s){
  if(!s||!s.birthday) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  const bd=new Date(s.birthday+'T00:00:00');
  const isToday=today.getMonth()===bd.getMonth()&&today.getDate()===bd.getDate();
  let next=new Date(today.getFullYear(),bd.getMonth(),bd.getDate());
  if(next<today) next=new Date(today.getFullYear()+1,bd.getMonth(),bd.getDate());
  const days=Math.round((next-today)/86400000);
  const claimedThisYear=(s.bdayClaims||[]).includes(today.getFullYear());
  return {isToday,days,claimedThisYear};
}
function genRewardCode(){ const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }

function parseTime12(str){
  const m=/(\d{1,2}):(\d{2})\s*(AM|PM)/i.exec(str||''); if(!m) return {h:0,m:0};
  let h=parseInt(m[1],10)%12; if(/PM/i.test(m[3])) h+=12;
  return {h,m:parseInt(m[2],10)};
}
function nextOccurrence(dayName,timeStr){
  const now=new Date();
  const targetIdx=DAYS.indexOf(dayName);
  const t=parseTime12(timeStr);
  const diff=(targetIdx-now.getDay()+7)%7;
  const cand=new Date(now); cand.setDate(now.getDate()+diff); cand.setHours(t.h,t.m,0,0);
  if(cand<now) cand.setDate(cand.getDate()+7);
  return cand;
}

function computeTeacherSalary(tid){
  const myClassIds=new Set(DB.classes.filter(c=>c.teacherId===tid).map(c=>c.id));
  const isSingle=p=>((p.month||'')+' '+(p.notes||'')).toLowerCase().includes('single class');
  const isTrial=p=>((p.month||'')+' '+(p.notes||'')).toLowerCase().includes('trial class');
  const isCreditUse=p=>p.kind==='credit-use';
  const isBonus=p=>p.kind==='bonus-class';
  const earnedMonthOf=p=>p.earnedDate?monthNameFromDate(p.earnedDate):p.month;
  const virtualCreditUses=(DB.attendance||[]).filter(a=>a.paidByCredit&&!a.extra&&a.status==='present'&&myClassIds.has(a.classId))
    .map(a=>({kind:'credit-use',studentId:a.studentId,classId:a.classId,month:'Credit',amount:0,status:'Paid',date:a.date,earnedDate:a.date}));
  const virtualBonusClasses=(DB.attendance||[]).filter(a=>a.bonus&&a.status==='present'&&myClassIds.has(a.classId))
    .map(a=>({kind:'bonus-class',studentId:a.studentId,classId:a.classId,month:'Bonus',amount:0,status:'Paid',date:a.date,earnedDate:a.date}));
  const myDanceShows=DB.payments.filter(p=>p.kind==='danceshow'&&p.status==='Paid'&&p.teacherId===tid);
  const myPrivates=DB.payments.filter(p=>p.kind==='private'&&p.status==='Paid'&&p.teacherId===tid);
  const allPaid=DB.payments.filter(p=>p.status==='Paid'&&p.classId&&myClassIds.has(p.classId)&&!isCreditUse(p))
    .concat(virtualCreditUses).concat(virtualBonusClasses).concat(myDanceShows).concat(myPrivates);

  let monthlySingleRateEarn=0,monthlyMultiRateEarn=0,singleClassEarn=0,danceShowEarn=0,privateEarn=0;
  let monthlySingleRateQty=0,monthlyMultiRateClassQty=0,singleClassQty=0,danceShowQty=0,privateQty=0;
  const rows=[]; const monthlyClassCountByMonth={}; const monthlyPayRows=[];

  allPaid.forEach(p=>{
    const earnedMonth=earnedMonthOf(p);
    if(p.kind==='danceshow'){ const earn=(typeof p.teacherEarn==='number')?p.teacherEarn:0; danceShowEarn+=earn; danceShowQty++;
      rows.push({student:{name:'Dance Show'},type:'Dance Show',amount:p.amount,earn,earnedMonth,date:p.earnedDate||p.date}); return; }
    if(p.kind==='private'){ const earn=(typeof p.teacherEarn==='number')?p.teacherEarn:0; privateEarn+=earn; privateQty++;
      rows.push({student:payStudent(p),type:'Private Class',amount:p.amount,earn,earnedMonth,date:p.earnedDate||p.date}); return; }
    const st=payStudent(p);
    if(!st||(!st.id&&!st.typed)) return;
    if(isCreditUse(p)){ singleClassEarn+=SALARY_PER_SINGLE; singleClassQty++; rows.push({student:st,type:'Credit Class',amount:0,earn:SALARY_PER_SINGLE,earnedMonth,date:p.date}); }
    else if(isBonus(p)){ singleClassEarn+=SALARY_PER_SINGLE; singleClassQty++; rows.push({student:st,type:'Bonus Class',amount:0,earn:SALARY_PER_SINGLE,earnedMonth,date:p.date}); }
    else if(isSingle(p)){ singleClassEarn+=SALARY_PER_SINGLE; singleClassQty++; rows.push({student:st,type:'Single Class',amount:p.amount,earn:SALARY_PER_SINGLE,earnedMonth,date:p.date}); }
    else if(isTrial(p)){ singleClassEarn+=SALARY_PER_SINGLE; singleClassQty++; rows.push({student:st,type:'Trial Class',amount:p.amount,earn:SALARY_PER_SINGLE,earnedMonth,date:p.date}); }
    else{ const totalClasses=(st.classIds||[]).length; monthlyPayRows.push({p,student:st,earnedMonth,isSingleRate:totalClasses<=1});
      monthlyClassCountByMonth[earnedMonth]=(monthlyClassCountByMonth[earnedMonth]||0)+1; }
  });
  monthlyPayRows.forEach(({p,student,earnedMonth,isSingleRate})=>{
    const rate=salaryRateForHeadcount(monthlyClassCountByMonth[earnedMonth]);
    if(isSingleRate){ monthlySingleRateEarn+=rate; monthlySingleRateQty++; rows.push({student,type:'Monthly (single-rate)',amount:p.amount,earn:rate,earnedMonth,date:p.date}); }
    else{ monthlyMultiRateEarn+=rate; monthlyMultiRateClassQty++; rows.push({student,type:'Monthly (multi-rate)',amount:p.amount,earn:rate,earnedMonth,date:p.date}); }
  });
  const tierRows=Object.keys(monthlyClassCountByMonth).map(m=>({month:m,headcount:monthlyClassCountByMonth[m],rate:salaryRateForHeadcount(monthlyClassCountByMonth[m])}));
  const total=monthlySingleRateEarn+monthlyMultiRateEarn+singleClassEarn+danceShowEarn+privateEarn;
  return {total,monthlySingleRateEarn,monthlySingleRateQty,monthlyMultiRateEarn,monthlyMultiRateClassQty,singleClassEarn,singleClassQty,danceShowEarn,danceShowQty,privateEarn,privateQty,tierRows,
    rows:rows.sort((a,b)=>(b.date||'').localeCompare(a.date||''))};
}

function nearestPastOrTodayDate(dayName){
  const today=new Date();
  const targetIdx=DAYS.indexOf(dayName);
  const diff=(today.getDay()-targetIdx+7)%7;
  const d=new Date(today); d.setDate(today.getDate()-diff);
  return toLocalISODate(d);
}
let markClassId=null, markDate=null, markPending={}, markRemarkOpenFor=null;
function renderMarkPage(){
  const tid=session.ref;

  const cls=DB.classes.find(c=>c.id===markClassId);
  if(!markDate) markDate=nearestPastOrTodayDate(cls.day);
  const roster=DB.students.filter(s=>s.classIds&&s.classIds.includes(cls.id));
  const statusOf=sid=>{
    if(markPending[sid]) return markPending[sid];
    const rec=DB.attendance.find(a=>a.classId===cls.id&&a.date===markDate&&a.studentId===sid&&!a.extra);
    return rec?{status:rec.status,remark:rec.remark||''}:{status:null,remark:''};
  };
  const markedCount=roster.filter(s=>statusOf(s.id).status).length;
  const pct=roster.length?Math.round(markedCount/roster.length*100):0;
  el.innerHTML=`
    <h2 class="dsp" style="font-size:30px;text-transform:uppercase;margin:0 0 4px">${tr('markAttendance')}</h2>
    <p style="color:var(--g5);font-size:11px;margin:0 0 14px">${tr('pickAClass')}</p>
    <div class="bd-scroll" style="display:flex;gap:6px;margin-bottom:14px;overflow-x:auto">
      ${myCls.map(c=>`<button onclick="setMarkClass(${c.id})" class="mn" style="flex-shrink:0;font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;cursor:pointer;border:1px solid ${c.id===markClassId?'var(--acc)':'var(--bd)'};background:${c.id===markClassId?'var(--acc)':'transparent'};color:${c.id===markClassId?'#000':'var(--g4)'}">${H(c.name)}</button>`).join('')}
    </div>
    <div style="background:var(--card);border:1px solid var(--bd);padding:14px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <label class="field-label" style="margin:0">Date</label>
        <input type="date" id="mark-date-input" value="${markDate}" onchange="setMarkDate(this.value)" style="background:#000;border:1px solid #3d3a36;color:#fff;font-size:12px;padding:6px 8px;font-family:'JetBrains Mono',monospace"/>
      </div>
      <div class="mn" style="display:flex;justify-content:space-between;font-size:10px;color:var(--g5);margin-bottom:6px"><span>${tr('marked')}</span><span style="color:var(--acc)">${markedCount}/${roster.length}</span></div>
      <div style="height:6px;background:#000;border:1px solid var(--bd)"><div style="height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:${pct}%;transition:width .3s"></div></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button onclick="markAllPresentLocal()" class="mn" style="flex:1;background:transparent;border:1px solid #a84715;color:var(--acc2);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:10px;cursor:pointer"><i class="ph ph-checks" style="margin-right:6px"></i>${tr('allPresent')}</button>
        <button onclick="resetMarksLocal()" class="mn" style="flex:0 0 auto;background:transparent;border:1px solid var(--bd);color:var(--g5);font-size:9.5px;font-weight:700;padding:10px 12px;cursor:pointer"><i class="ph ph-arrow-counter-clockwise"></i></button>
      </div>
    </div>
    <p style="color:var(--g5);font-size:10px;line-height:1.6;margin:0 0 12px"><i class="ph ph-info"></i> Updates the attendance record only — billing and credit deductions still happen on the desktop site.</p>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${roster.length?roster.map(s=>{
        const st=statusOf(s.id);
        const editing=markRemarkOpenFor===s.id;
        const opts=[['present','Present','ph-check'],['absent','Absent','ph-x'],['cancelled','Cancelled','ph-prohibit']];
        return `<div style="background:var(--card);border:1px solid ${st.status?'var(--acc)':'var(--bd)'};padding:11px">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="width:32px;height:32px;flex-shrink:0;background:linear-gradient(150deg,#5c2a10,#3a2010);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff">${ini(s.name)}</span>
            <div style="flex:1;min-width:0"><p style="color:#fff;font-weight:600;font-size:12.5px;margin:0">${H(s.name)}</p><p class="mn" style="color:var(--g5);font-size:9.5px;margin:3px 0 0">Age ${ageOf(s)}</p></div>
            <button onclick="toggleMarkRemark(${s.id})" style="background:none;border:1px solid var(--bd);color:${st.remark?'#6fa8ff':'var(--g5)'};width:30px;height:30px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center"><i class="ph ph-note-pencil" style="font-size:14px"></i></button>
          </div>
          <div style="display:flex;gap:6px;margin-top:10px">
            ${opts.map(([val,label,icon])=>`<button onclick="markLocal(${s.id},'${val}')" class="mn" style="flex:1;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:9px 2px;cursor:pointer;border:1px solid ${st.status===val?'var(--acc)':'var(--bd)'};background:${st.status===val?'var(--acc)':'transparent'};color:${st.status===val?'#000':'var(--g4)'}"><i class="ph ${icon}" style="margin-right:5px"></i>${label}</button>`).join('')}
          </div>
          ${editing?`<div style="margin-top:10px">
            <input id="remark-input-${s.id}" value="${H(st.remark||'')}" placeholder="${tr('addRemark')}" style="width:100%;background:#000;border:1px solid #3d3a36;color:#fff;font-size:12px;padding:10px;outline:none;font-family:Inter,sans-serif"/>
            <button onclick="saveMarkRemark(${s.id})" class="mn" style="width:100%;margin-top:7px;background:var(--acc);color:var(--ink);font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:9px;border:0;cursor:pointer">${tr('saveRemark')}</button>
          </div>`:(st.remark?`<p style="color:#6fa8ff;font-size:10.5px;margin:9px 0 0"><i class="ph ph-note-pencil"></i> ${H(st.remark)}</p>`:'')}
        </div>`;}).join(''):`<p style="color:var(--g5);font-size:12px">No students enrolled in this class yet.</p>`}
    </div>
    <button onclick="saveMarksToServer()" id="mark-save-btn" class="mn btn-fill" style="width:100%;margin-top:14px;background:var(--acc);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:14px;border:0;cursor:pointer">${tr('saveRoster')}</button>`;
}
function setMarkClass(id){ markClassId=id; markDate=null; markPending={}; markRemarkOpenFor=null; renderMarkPage(); }
function setMarkDate(v){ markDate=v; markPending={}; markRemarkOpenFor=null; renderMarkPage(); }
function markLocal(sid,status){ markPending[sid]={status,remark:(markPending[sid]&&markPending[sid].remark)||''}; markRemarkOpenFor=null; renderMarkPage(); }
function markAllPresentLocal(){
  const cls=DB.classes.find(c=>c.id===markClassId);
  const roster=DB.students.filter(s=>s.classIds&&s.classIds.includes(cls.id));
  roster.forEach(s=>{
    const existing=DB.attendance.find(a=>a.classId===cls.id&&a.date===markDate&&a.studentId===s.id&&!a.extra);
    if(!markPending[s.id]&&!(existing&&existing.status)) markPending[s.id]={status:'present',remark:''};
  });
  renderMarkPage();
}
function resetMarksLocal(){ markPending={}; markRemarkOpenFor=null; renderMarkPage(); }
function toggleMarkRemark(sid){ markRemarkOpenFor=markRemarkOpenFor===sid?null:sid; renderMarkPage(); }
function saveMarkRemark(sid){
  const val=document.getElementById('remark-input-'+sid).value;
  markPending[sid]={status:(markPending[sid]&&markPending[sid].status)||(DB.attendance.find(a=>a.classId===markClassId&&a.date===markDate&&a.studentId===sid&&!a.extra)||{}).status||'present',remark:val};
  markRemarkOpenFor=null;
  renderMarkPage();
}
async function saveMarksToServer(){
  const entries=Object.entries(markPending);
  if(!entries.length){ toast(tr('markSaved')); return; }
  const btn=document.getElementById('mark-save-btn'); btn.disabled=true; btn.style.opacity='.6';
  const classId=markClassId, date=markDate;
  const fresh=await cloudLoadFull();
  if(!fresh){ btn.disabled=false; btn.style.opacity='1'; toast(tr('markFailed')); return; }
  entries.forEach(([sid,val])=>{
    sid=parseInt(sid,10);
    let rec=DB.attendance.find(a=>a.classId===classId&&a.date===date&&a.studentId===sid&&!a.extra);
    if(rec){ rec.status=val.status; if(val.remark) rec.remark=val.remark; else delete rec.remark; }
    else{ const r={id:(nid.attendance=nid.attendance||1)&&nid.attendance++,classId,date,studentId:sid,status:val.status}; if(val.remark) r.remark=val.remark; DB.attendance.push(r); }
  });
  try{
    const r=await fetchWithTimeout(CLOUD_URL,{method:'POST',headers:authHeaders(),body:JSON.stringify({data:JSON.stringify({db:DB,nid})})},8000);
    const j=r&&r.ok?await r.json().catch(()=>null):null;
    btn.disabled=false; btn.style.opacity='1';
    if(j&&j.ok){ markPending={}; toast(tr('markSaved')); renderMarkPage(); }
    else toast(tr('markFailed'));
  }catch(e){ btn.disabled=false; btn.style.opacity='1'; toast(tr('markFailed')); }
}
